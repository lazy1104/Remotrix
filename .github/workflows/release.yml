name: release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changelog:
    name: Pass through CHANGELOG.md
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Upload CHANGELOG artifact
        uses: actions/upload-artifact@v4
        with:
          name: changelog
          path: CHANGELOG.md

  package:
    name: package (${{ matrix.triple }})
    runs-on: ${{ matrix.os }}
    needs: changelog
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
            formats: deb,appimage
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
            formats: nsis
    steps:
      - uses: actions/checkout@v4

      - name: Download changelog
        uses: actions/download-artifact@v4
        with:
          name: changelog
          path: .

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: dist

      - name: Cache & install cargo-packager
        uses: taiki-e/cache-cargo-install-action@v2
        with:
          tool: cargo-packager

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev

      - name: Install Windows build deps (aws-lc-sys)
        if: runner.os == 'Windows'
        shell: bash
        run: choco install nasm cmake -y

      - name: Build release binary
        run: cargo build --profile dist --locked

      - name: Package installers
        run: cargo packager --release --config packager.toml --formats ${{ matrix.formats }}

      - name: Generate checksums
        shell: bash
        run: |
          cd target/release/bundle
          shopt -s nullglob
          files=( *.deb *.AppImage *.exe )
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No installer packages found to checksum" >&2
            exit 1
          fi
          sha256sum "${files[@]}" > checksums.sha256

      - name: Extract release notes for this tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          python3 - "$version" CHANGELOG.md > "$GITHUB_WORKSPACE/.release-notes.md" <<'PY'
          import sys, pathlib
          target, path = sys.argv[1], pathlib.Path(sys.argv[2])
          lines = path.read_text(encoding='utf-8').splitlines(keepends=False)
          start = end = None
          for i, ln in enumerate(lines):
              stripped = ln.strip()
              if start is None and (stripped == f'## [{target}]' or stripped.startswith(f'## [{target}] -')):
                  start = i
              elif start is not None and ln.startswith('## [') and i != start:
                  end = i
                  break
          if start is None:
              print(f'::error::no section for version {target} in {path}', file=sys.stderr)
              sys.exit(1)
          if end is None:
              end = len(lines)
          sys.stdout.write('\n'.join(lines[start:end]).rstrip() + '\n')
          PY

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: remotrix-${{ matrix.triple }}
          path: target/release/bundle/**

      - name: Attach installers to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body_path: .release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            target/release/bundle/*.deb
            target/release/bundle/*.AppImage
            target/release/bundle/*.exe
            target/release/bundle/checksums.sha256
