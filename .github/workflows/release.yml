name: release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: package (${{ matrix.triple }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
            formats: deb,appimage
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
            formats: nsis
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: swatinem/rust-cache@v2

      - name: Install cargo-packager
        run: cargo install cargo-packager --locked

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev

      - name: Build release binary
        run: cargo build --release --locked

      - name: Stage raw binary asset
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p target/release/bundle
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/release/remotrix.exe "target/release/bundle/remotrix-${VERSION}-windows-x86_64.exe"
          else
            cp target/release/remotrix "target/release/bundle/remotrix-${VERSION}-linux-x86_64"
          fi

      - name: Package installers
        run: cargo packager --release --config packager.toml --formats ${{ matrix.formats }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: remotrix-${{ matrix.triple }}
          path: target/release/bundle/**

      - name: Attach installers to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            target/release/bundle/*.deb
            target/release/bundle/*.AppImage
            target/release/bundle/*.exe
            target/release/bundle/remotrix-*-linux-x86_64
            target/release/bundle/remotrix-*-windows-x86_64.exe
