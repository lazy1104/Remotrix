name: release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deny:
    name: cargo-deny (${{ matrix.checks }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        checks:
          - advisories
          - bans licenses sources
    continue-on-error: ${{ matrix.checks == 'advisories' }}
    steps:
      - uses: actions/checkout@v4

      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check ${{ matrix.checks }}

  changelog:
    name: Generate changelog
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build changelog
        uses: mikepenz/release-changelog-builder-action@v5
        with:
          commitMode: true
          outputFile: CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload changelog artifact
        uses: actions/upload-artifact@v4
        with:
          name: changelog
          path: CHANGELOG.md

  package:
    name: package (${{ matrix.triple }})
    runs-on: ${{ matrix.os }}
    needs: changelog
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
            formats: deb,appimage
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
            formats: nsis
    steps:
      - uses: actions/checkout@v4

      - name: Download changelog
        uses: actions/download-artifact@v4
        with:
          name: changelog
          path: .

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          cache-on-failure: true
          shared-key: dist

      - name: Cache & install cargo-packager
        uses: taiki-e/cache-cargo-install-action@v2
        with:
          tool: cargo-packager

      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev

      - name: Build release binary
        run: cargo build --profile dist --locked

      - name: Stage raw binary asset
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p target/release/bundle
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/dist/remotrix.exe "target/release/bundle/remotrix-${VERSION}-windows-x86_64.exe"
          else
            cp target/dist/remotrix "target/release/bundle/remotrix-${VERSION}-linux-x86_64"
          fi

      - name: Generate checksums
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          cd target/release/bundle
          if [ "${{ runner.os }}" = "Windows" ]; then
            SLUG="windows-x86_64.exe"
          else
            SLUG="linux-x86_64"
          fi
          sha256sum "remotrix-${VERSION}-${SLUG}" > "remotrix-${VERSION}-${SLUG}.sha256"

      - name: Package installers
        run: cargo packager --release --config packager.toml --formats ${{ matrix.formats }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: remotrix-${{ matrix.triple }}
          path: target/release/bundle/**

      - name: Attach installers to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body_path: CHANGELOG.md
          files: |
            target/release/bundle/*.deb
            target/release/bundle/*.AppImage
            target/release/bundle/*.exe
            target/release/bundle/remotrix-*-linux-x86_64
            target/release/bundle/remotrix-*-windows-x86_64.exe
            target/release/bundle/remotrix-*-*.sha256
