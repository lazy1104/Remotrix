[package]
name = "remotrix"
version = "0.1.0"
edition = "2021"
description = "Rust-native download manager inspired by Motrix"
license = "GPL-2.0-or-later"

[[bin]]
name = "remotrix"
path = "src/main.rs"

[dependencies]
aria2-core = "0.2.3"
iced = { version = "0.14", features = ["tokio", "advanced", "image"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
directories = "5"
rfd = "0.15"
image = "0.24"
dark-light = "1.1"
fluent-templates = "0.14.0"

[patch.crates-io]
rsa = { path = "vendor/rsa" }

[build-dependencies]
iced_lucide = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
