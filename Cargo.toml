[package]
name = "remotrix"
version = "0.1.0"
edition = "2021"
description = "Rust-native download manager inspired by Motrix"
license = "MIT"

[[bin]]
name = "remotrix"
path = "src/main.rs"

[dependencies]
aria2-ws = "0.5"
iced = { version = "0.14", features = ["tokio", "advanced", "canvas", "svg", "markdown"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
directories = "5"
rfd = "0.15"
image = { version = "0.24", default-features = false, features = ["png"] }
dark-light = "1.1"
fluent-templates = "0.14.0"
futures = "0.3"
base64 = "0.22"
hex = "0.4"
num-traits = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "socks"] }
sha2 = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
open = "5"
libc = "0.2"
fontdb = "0.23"
sys-locale = "0.3"
iced_aw = { version = "0.14", default-features = false, features = ["time_picker"] }
app-single-instance = "0.1"
notify-rust = { version = "4.17", features = ["tokio"] }
ldtray = "=0.1.2"

[build-dependencies]
iced_lucide = "0.1"

[target.'cfg(windows)'.build-dependencies]
winres = "0.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = false
overflow-checks = true

[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 16
